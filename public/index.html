    <script>
      /* V2.0 阶段 3 · 本设备外观：新版（Midnight）/ 经典。只存本机 localStorage「nocturne.ui」，不进配置、不同步；
         在首帧前设好 html[data-ui]，两种外观共用同一份 DOM、数据与逻辑。默认 = 新版（v2 分支）。 */
      (function () { var v = null; try { v = localStorage.getItem("nocturne.ui"); } catch (e) { /* storage blocked */ }
        document.documentElement.setAttribute("data-ui", v === "classic" ? "classic" : "v2"); })();
    </script>
    <!--nocturne:boot-->
    <script>
      /* Nocturne backend · boot. No-op as a plain static page (server.js injects <script type="application/json" id="nocturne-boot">).
         CSP：本段与上面的 data-ui 段由 server.js 按内容 sha256 放行，改动后无需手工更新 hash。 */
      (function () {
        var el = document.getElementById("nocturne-boot");
        if (el) { try { window.NOCTURNE = JSON.parse(el.textContent); } catch (e) { /* 服务器生成的数据，不会出现 */ } }
        var N = window.NOCTURNE; if (!N) return;
        var de = document.documentElement;
        try {
          if (!N.user) { de.classList.add("nc-locked"); return; }
          var own = localStorage.getItem("nocturne.owner"), ver = +localStorage.getItem("nocturne.ver") || 0, has = !!localStorage.getItem("yeqv.v1");
          if (own && own !== N.user.name) { localStorage.removeItem("yeqv.v1"); localStorage.removeItem("nocturne.ver"); localStorage.removeItem("nocturne.dirty"); has = false; ver = 0; }
          N.migrate = !N.version && has;
          N.stale = N.version > 0 && ver !== N.version;
          N.dirty = has && localStorage.getItem("nocturne.dirty") === "1"; // 本机有上次没推上去的修改：先显示本机、推上去，不等服务器
        } catch (e) { N.stale = N.version > 0; }
        if (N.stale && !N.dirty) de.classList.add("nc-loading");
      })();
    </script>
