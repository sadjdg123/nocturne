  <style>
/* 夜曲 Nocturne V2.0 · Midnight Edition — 设计预览（阶段 0）
   深夜观测台 Midnight Observatory。只用于预览，不被正式首页引用。 */

:root {
  --ink: #0A0D14;
  --midnight: #121A2B;
  --dome: #1C2A44;
  --amber: #E7B467;
  --frost: #8FC9D6;
  --paper: #ECE6DA;
  --mist: #8E96A8;
  --coral: #E08A74;
  --line: rgba(236, 230, 218, .09);
  --line-2: rgba(236, 230, 218, .16);
  --ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --serif: "Noto Serif SC", "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", serif;
  --latin: "Cormorant Garamond", "Noto Serif SC", serif;
  --ease: cubic-bezier(.2, .75, .2, 1);
  --ease-io: cubic-bezier(.65, 0, .35, 1);
  --rail: 220px;
  --obs: 282px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--ink); overflow-x: clip; }
body { margin: 0; min-height: 100dvh; color: var(--paper); font: 400 15px/1.5 var(--ui); -webkit-font-smoothing: antialiased; overflow-x: clip; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { outline: 1.5px solid rgba(236, 230, 218, .7); outline-offset: 3px; border-radius: 10px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums lining-nums; }

/* ───────────── 三层背景：壁纸 → 穹顶光 + 暗角 → 内容材质 ───────────── */
.sky { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: var(--ink); }
.sky .wp { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .92; }
.sky .wp--m { display: none; }
.dome { position: absolute; inset: -10% -14%; opacity: 0; transform: rotate(-14deg) scale(1.06); transform-origin: 58% 0%;
  transition: opacity .66s var(--ease-io), transform .66s var(--ease-io); will-change: opacity, transform; }
.dome.is-on { opacity: 1; transform: none; }
.dome.is-off { opacity: 0; transform: rotate(14deg) scale(1.04); }
.dome--midnight {
  background:
    radial-gradient(ellipse 46% 40% at 56% 16%, rgba(36, 54, 88, .60), transparent 70%),
    conic-gradient(from 166deg at 57% -2%, transparent 0deg, rgba(143, 201, 214, .10) 9deg, transparent 20deg, transparent 34deg, rgba(236, 230, 218, .07) 42deg, transparent 54deg, transparent 360deg);
}
.dome--dawn {
  background:
    radial-gradient(ellipse 62% 40% at 34% 84%, rgba(231, 170, 96, .34), transparent 72%),
    radial-gradient(ellipse 44% 34% at 62% 14%, rgba(130, 84, 50, .42), transparent 70%),
    radial-gradient(ellipse 60% 40% at 60% 62%, rgba(200, 140, 80, .14), transparent 72%),
    conic-gradient(from 168deg at 55% -2%, transparent 0deg, rgba(231, 180, 103, .12) 10deg, transparent 24deg, transparent 36deg, rgba(231, 180, 103, .06) 44deg, transparent 56deg, transparent 360deg),
    linear-gradient(180deg, rgba(70, 44, 24, .16), rgba(110, 70, 34, .20));
}
.dome--indigo {
  background:
    radial-gradient(ellipse 56% 48% at 60% 14%, rgba(98, 70, 190, .55), transparent 70%),
    radial-gradient(ellipse 46% 40% at 24% 72%, rgba(126, 74, 176, .32), transparent 72%),
    conic-gradient(from 158deg at 60% -2%, transparent 0deg, rgba(170, 150, 240, .11) 12deg, transparent 28deg, transparent 46deg, rgba(170, 150, 240, .07) 54deg, transparent 66deg, transparent 360deg),
    linear-gradient(180deg, rgba(44, 30, 100, .26), rgba(40, 26, 90, .14));
}
.dome--frost {
  background:
    radial-gradient(ellipse 54% 44% at 60% 8%, rgba(143, 201, 214, .30), transparent 70%),
    radial-gradient(ellipse 50% 40% at 80% 90%, rgba(28, 52, 78, .50), transparent 72%),
    conic-gradient(from 170deg at 61% -2%, transparent 0deg, rgba(143, 201, 214, .13) 8deg, transparent 18deg, transparent 30deg, rgba(143, 201, 214, .06) 36deg, transparent 46deg, transparent 360deg),
    linear-gradient(180deg, rgba(30, 70, 92, .20), rgba(16, 36, 56, .14));
}
.vignette { position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 110% 85% at 56% 28%, transparent 38%, rgba(10, 13, 20, .78) 100%),

.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr) var(--obs); grid-template-areas: "rail main obs"; min-height: 100dvh; }
.rail { grid-area: rail; position: sticky; top: 0; height: 100dvh; align-self: start; display: flex; flex-direction: column; padding: 34px 20px 22px 28px;
  background: linear-gradient(90deg, rgba(10, 13, 20, .74) 0%, rgba(10, 13, 20, .42) 78%, rgba(10, 13, 20, 0) 100%); }
.main { grid-area: main; min-width: 0; padding: 38px clamp(24px, 3vw, 52px) 72px; }
.main-in { max-width: 980px; margin: 0 auto; }
.obs { grid-area: obs; position: sticky; top: 0; height: 100dvh; align-self: start; overflow-y: auto; scrollbar-width: none; padding: 38px 28px 24px 22px;
  background: linear-gradient(270deg, rgba(10, 13, 20, .74) 0%, rgba(10, 13, 20, .40) 80%, rgba(10, 13, 20, 0) 100%); }
.obs::-webkit-scrollbar { display: none; }
.mbar, .mdock { display: none; }

/* ───────────── 左栏：品牌 + 空间索引 ───────────── */
.brand { display: flex; align-items: baseline; gap: 9px; margin: 0 0 44px; font: 500 23px/1.1 var(--serif); letter-spacing: .1em; white-space: nowrap; }
.brand em { font: italic 400 19px/1 var(--latin); color: var(--amber); letter-spacing: .02em; }
.rail-h { font: 500 12.5px/1 var(--ui); color: var(--mist); letter-spacing: .12em; margin: 0 0 12px 2px; }
.spaces { position: relative; display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.sp { position: relative; width: 100%; display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 10px 0 16px; border: 0; border-radius: 12px; background: none; text-align: left;
  color: var(--mist); transition: color .3s ease, background-color .3s ease; }
.sp:hover { color: var(--paper); background: rgba(236, 230, 218, .035); }
.sp[aria-current="true"] { color: var(--paper); }
.sp .sw { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--sw); opacity: .55; transition: opacity .3s ease, box-shadow .3s ease; }
.sp[aria-current="true"] .sw { opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--sw) 22%, transparent); }
.sp .nm { flex: 1; min-width: 0; font: 500 17px/1.2 var(--serif); letter-spacing: .06em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp .ct { font: 400 13px/1 var(--ui); font-variant-numeric: tabular-nums; color: var(--mist); }
.sp-ind { position: absolute; left: 0; top: 0; width: 2px; height: 22px; border-radius: 2px; background: var(--amber); transform: translateY(var(--y, 12px)); transition: transform .42s var(--ease); }
.rail-act { display: inline-flex; align-items: center; gap: 8px; margin: 14px 0 0 6px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: none; color: var(--mist); font-size: 13.5px; }
.rail-act:hover { color: var(--paper); background: rgba(236, 230, 218, .04); }
.rail-act svg { width: 16px; height: 16px; }
.rail-foot { margin-top: auto; display: grid; gap: 14px; }
.netbtn { width: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; min-height: 54px; padding: 8px 12px 8px 14px; border-radius: 14px;
  border: 1px solid var(--line); background: rgba(18, 26, 43, .55); text-align: left; transition: border-color .25s ease, background-color .25s ease; }
.netbtn:hover { border-color: var(--line-2); background: rgba(28, 42, 68, .55); }
.netbtn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--frost); box-shadow: 0 0 0 3px rgba(143, 201, 214, .14); }
.netbtn[data-eff="wan"] .dot { background: var(--paper); box-shadow: 0 0 0 3px rgba(236, 230, 218, .12); }
.netbtn b { display: block; font: 500 14px/1.25 var(--ui); }
.netbtn small { display: block; font-size: 12px; color: var(--mist); line-height: 1.35; }
.netbtn svg { width: 16px; height: 16px; color: var(--mist); }
.acct { display: flex; align-items: center; gap: 11px; padding: 4px 4px 0 6px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; font: 500 15px/1 var(--latin); font-size: 19px; color: var(--paper);
  background: linear-gradient(150deg, #2A3A5C, #151D30); border: 1px solid var(--line-2); }
.acct b { display: block; font: 500 14px/1.2 var(--ui); }
.acct small { display: block; font-size: 12px; color: var(--mist); }

/* ───────────── 中心：时钟 + 问候 + 搜索 ───────────── */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 24px; margin: 6px 0 30px; }
.clock { display: flex; align-items: flex-start; font: 300 128px/.86 var(--latin); letter-spacing: -.01em; font-variant-numeric: tabular-nums lining-nums; font-feature-settings: "lnum" 1, "tnum" 1;
  color: var(--paper); text-shadow: 0 2px 30px rgba(0, 0, 0, .35); margin-left: -6px; }
.clock .col { opacity: .7; margin: 0 .02em; transform: translateY(-.04em); }
.clock .sec { font-size: 30px; line-height: 1; color: var(--mist); margin: 14px 0 0 14px; letter-spacing: .02em; }
.dateline { margin-top: 18px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.greet { font: 500 21px/1.35 var(--serif); letter-spacing: .06em; }
.date { font-size: 14px; color: var(--mist); letter-spacing: .08em; }
.sp-title { text-align: right; padding-bottom: 6px; }
.sp-title small { display: block; font-size: 12.5px; color: var(--mist); letter-spacing: .1em; margin-bottom: 8px; }
.sp-title h1 { font: 500 34px/1.1 var(--serif); letter-spacing: .1em; }
.sp-title p { margin-top: 8px; font-size: 13.5px; color: var(--mist); }
.mstat { display: none; }

.search { position: relative; margin: 0 0 12px; }
.bar { display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 10px 0 20px; border-radius: 18px;
  background: rgba(18, 26, 43, .56); -webkit-backdrop-filter: blur(22px) saturate(135%); backdrop-filter: blur(22px) saturate(135%);
  border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(236, 230, 218, .05), 0 18px 40px -24px rgba(0, 0, 0, .7);
  transition: border-color .25s ease, background-color .25s ease, box-shadow .25s ease; }
.bar:focus-within { border-color: rgba(236, 230, 218, .26); background: rgba(22, 31, 50, .66); box-shadow: inset 0 1px 0 rgba(236, 230, 218, .07), 0 0 0 5px rgba(236, 230, 218, .04), 0 18px 40px -24px rgba(0, 0, 0, .7); }
.bar > svg { width: 19px; height: 19px; color: var(--mist); flex: none; }
.bar input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; font-size: 16.5px; outline: none; -webkit-appearance: none; appearance: none; }
.bar input::placeholder { color: var(--mist); }
.bar input::-webkit-search-cancel-button { -webkit-appearance: none; }
.kbd { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(10, 13, 20, .35); color: var(--mist); font-size: 12.5px; }
.kbd:hover { color: var(--paper); border-color: var(--line-2); }
.kbd span { font-family: var(--ui); }
.engines { display: flex; align-items: center; gap: 4px; margin: 0 0 40px 8px; overflow-x: auto; scrollbar-width: none; }
.engines::-webkit-scrollbar { display: none; }
.engines .lbl { font-size: 12.5px; color: var(--mist); margin-right: 8px; white-space: nowrap; }
.eng { position: relative; flex: none; min-height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: none; color: var(--mist); font-size: 13.5px; transition: color .2s ease; }
.eng:hover { color: var(--paper); }
.eng[aria-pressed="true"] { color: var(--paper); }
.eng[aria-pressed="true"]::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--amber); }

/* ───────────── 分组与卡片 ───────────── */
.view { position: relative; }
.view.is-out .grp { opacity: 0; transform: translateY(6px); transition: opacity .15s ease, transform .15s ease; }
.view.is-in .grp { animation: g-in .34s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes g-in { from { opacity: 0; transform: translateY(10px); } }
.grp { margin: 0 0 34px; }
.gh { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px; }
.gh h2 { font: 500 18px/1.3 var(--serif); letter-spacing: .08em; }
.gh .ct { font-size: 12.5px; color: var(--mist); font-variant-numeric: tabular-nums; }
.gh .rule { flex: 1; height: 1px; align-self: center; background: linear-gradient(90deg, rgba(236, 230, 218, .16), rgba(236, 230, 218, 0)); }
.gh .shared { font-size: 12px; color: var(--mist); white-space: nowrap; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(184px, 1fr)); gap: 10px; }

/* 共用：字母徽记图标 */
.mono { width: 40px; height: 40px; flex: none; border-radius: 11px; display: grid; place-items: center; color: var(--paper);
  font: 600 14px/1 var(--ui); letter-spacing: .02em;
  background: linear-gradient(150deg, color-mix(in srgb, var(--tone) 78%, #fff 22%), var(--tone) 55%, color-mix(in srgb, var(--tone) 70%, #000 30%));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 0 0 1px rgba(255, 255, 255, .06), 0 6px 14px -8px rgba(0, 0, 0, .7); }
.mono.cjk { font: 500 17px/1 var(--serif); }

.it { position: relative; display: flex; align-items: center; gap: 12px; min-width: 0; min-height: 70px; padding: 14px 14px 14px 14px; border-radius: 14px; text-decoration: none; color: var(--paper);
  background: linear-gradient(180deg, rgba(28, 42, 68, .50), rgba(16, 23, 38, .56)); border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(236, 230, 218, .04);
  transition: transform .22s var(--ease), border-color .22s ease, background-color .22s ease, box-shadow .22s ease; }
.it .tx { flex: 1; min-width: 0; display: grid; gap: 2px; }
.it .tt { font-size: 15px; font-weight: 500; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.it .ds { font-size: 12.5px; color: var(--mist); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st { width: 6px; height: 6px; border-radius: 50%; flex: none; background: rgba(143, 201, 214, .55); }
.it .st { position: absolute; top: 11px; right: 11px; }
.st[data-s="down"] { background: var(--coral); box-shadow: 0 0 0 3px rgba(224, 138, 116, .16); }
.it[data-s="down"] .tt { color: rgba(236, 230, 218, .72); }
@media (hover: hover) and (pointer: fine) {
  .it:hover { transform: translateY(-2px); border-color: var(--line-2); background-color: rgba(28, 42, 68, .3); box-shadow: inset 0 1px 0 rgba(236, 230, 218, .07), 0 16px 30px -18px rgba(0, 0, 0, .8); }
}
.it:active { transform: scale(.975); transition-duration: .08s; }

/* 「常用」这类 chip 分组：轻量行内链接，避免整页都是同一种卡片 */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 16px 0 5px; border-radius: 23px; text-decoration: none; color: var(--paper); font-size: 14px;
  border: 1px solid var(--line); background: rgba(16, 23, 38, .5); transition: border-color .2s ease, transform .2s var(--ease); }
.chip .mono { width: 34px; height: 34px; border-radius: 17px; font-size: 12px; }
@media (hover: hover) and (pointer: fine) { .chip:hover { border-color: var(--line-2); transform: translateY(-1px); } }
.chip:active { transform: scale(.97); }

/* 娱乐：海报式大卡 */
body[data-density="poster"] .grid { grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 16px; }
body[data-density="poster"] .grp { margin-bottom: 44px; }
body[data-density="poster"] .gh { margin-bottom: 18px; }
body[data-density="poster"] .gh h2 { font-size: 26px; letter-spacing: .12em; }
body[data-density="poster"] .gh .rule { display: none; }
.poster { position: relative; display: flex; flex-direction: column; min-width: 0; border-radius: 16px; overflow: hidden; text-decoration: none; color: var(--paper);
  border: 1px solid rgba(236, 230, 218, .08); background: #0E1320;
  box-shadow: 0 22px 40px -28px rgba(0, 0, 0, .9);
  transition: transform .28s var(--ease), border-color .28s ease, box-shadow .28s ease; }
.poster .cv { position: relative; aspect-ratio: 4 / 4.4; overflow: hidden;
  background:
    radial-gradient(120% 90% at 22% 0%, color-mix(in srgb, var(--tone) 70%, #fff 30%) 0%, var(--tone) 38%, color-mix(in srgb, var(--tone) 35%, #070910 65%) 100%); }
.poster .cv::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, .06), transparent 30%, rgba(7, 9, 16, .55) 100%); }
.poster .big { position: absolute; right: -6px; bottom: -22px; font: 300 132px/1 var(--latin); color: rgba(236, 230, 218, .22); letter-spacing: -.02em; }
.poster .big.cjk { font: 500 96px/1 var(--serif); bottom: -10px; right: -4px; color: rgba(236, 230, 218, .16); }
.poster .mono { position: absolute; left: 16px; top: 16px; width: 36px; height: 36px; border-radius: 10px; background: rgba(10, 13, 20, .28); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); font-size: 13px; }
.poster .st { position: absolute; right: 16px; top: 20px; }
.poster .cap { padding: 14px 16px 16px; display: grid; gap: 3px; }
.poster .tt { font: 500 17px/1.3 var(--serif); letter-spacing: .04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.poster .ds { font-size: 12.5px; color: var(--mist); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (hover: hover) and (pointer: fine) {
  .poster:hover { transform: translateY(-4px); border-color: rgba(236, 230, 218, .18); box-shadow: 0 30px 50px -28px rgba(0, 0, 0, .95); }
}
.poster:active { transform: scale(.975); transition-duration: .08s; }

/* NAS：紧凑高密度行，状态为主 */
body[data-density="compact"] .grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0 28px; }
body[data-density="compact"] .grp { margin-bottom: 18px; padding: 14px 18px 8px; border-radius: 16px; background: linear-gradient(180deg, rgba(14, 20, 33, .62), rgba(10, 14, 24, .55)); border: 1px solid var(--line); }
body[data-density="compact"] .row:last-child, body[data-density="compact"] .grid > .row:nth-last-child(2):nth-child(odd) { border-bottom-color: transparent; }
body[data-density="compact"] .gh { margin-bottom: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
body[data-density="compact"] .gh h2 { font: 500 14px/1.3 var(--ui); letter-spacing: .06em; color: var(--paper); }
body[data-density="compact"] .gh .rule { display: none; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 54px; padding: 8px 6px; border-bottom: 1px solid rgba(236, 230, 218, .05);
  text-decoration: none; color: var(--paper); border-radius: 8px; transition: background-color .2s ease; }
.row .mono { width: 28px; height: 28px; border-radius: 8px; font-size: 11px; }
.row .mono.cjk { font-size: 13px; }
.row .tx { min-width: 0; display: grid; gap: 1px; }
.row .tt { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .host { font-size: 12px; color: var(--mist); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .lat { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--frost); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row[data-s="down"] .lat { color: var(--coral); }
@media (hover: hover) and (pointer: fine) { .row:hover { background: rgba(236, 230, 218, .04); } }
.row:active { background: rgba(236, 230, 218, .06); }

/* 空空间 */
.empty { padding: 56px 0 40px; max-width: 460px; }
.empty .glyph { width: 56px; height: 56px; border-radius: 50%; border: 1px dashed rgba(236, 230, 218, .28); display: grid; place-items: center; margin-bottom: 22px; color: var(--mist); }
.empty .glyph svg { width: 22px; height: 22px; }
.empty h2 { font: 500 24px/1.35 var(--serif); letter-spacing: .06em; }
.empty p { margin-top: 10px; color: var(--mist); font-size: 14.5px; line-height: 1.7; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--line-2); background: rgba(236, 230, 218, .05); color: var(--paper); font-size: 14.5px; font-weight: 500; transition: background-color .2s ease, border-color .2s ease, transform .15s ease; }
.btn:hover { background: rgba(236, 230, 218, .09); }
.btn:active { transform: scale(.98); }
.btn.pri { background: var(--amber); border-color: var(--amber); color: #1B1408; }
.btn.pri:hover { background: #EDC07E; }
.empty .btn { margin-top: 24px; }

/* 编辑模式（演示：保留长按 / 编辑入口） */
body.editing .it, body.editing .poster, body.editing .row, body.editing .chip { outline: 1px dashed rgba(231, 180, 103, .45); outline-offset: -1px; }
.ebar { position: fixed; z-index: 30; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%); display: none; align-items: center; gap: 14px; padding: 8px 8px 8px 18px; border-radius: 16px;
  background: rgba(14, 19, 31, .94); border: 1px solid var(--line-2); box-shadow: 0 20px 40px -20px rgba(0, 0, 0, .9); font-size: 14px; white-space: nowrap; }
body.editing .ebar { display: flex; }

/* ───────────── 右栏：观测记录 ───────────── */
.obs-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 22px; }
.obs-h h2 { font: 500 20px/1.2 var(--serif); letter-spacing: .1em; }
.sim { font-size: 11.5px; color: var(--mist); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); white-space: nowrap; }
.obs-sum { display: flex; align-items: center; gap: 18px; padding-bottom: 22px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
.ring { width: 76px; height: 76px; flex: none; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 3; }
.ring .bg { stroke: rgba(236, 230, 218, .10); }
.ring .fg { stroke: var(--frost); stroke-linecap: round; transition: stroke-dashoffset .6s var(--ease); }
.obs-sum .big { font: 300 46px/1 var(--latin); font-feature-settings: "lnum" 1, "tnum" 1; }
.obs-sum .big small { font: 400 14px/1 var(--ui); color: var(--mist); margin-left: 6px; }
.obs-sum p { margin-top: 6px; font-size: 12.5px; color: var(--mist); line-height: 1.45; }
.obs-sec { margin-bottom: 24px; transition: opacity .2s ease; }
.obs.is-swap .obs-sec, .obs.is-swap .obs-sum { opacity: .25; }
.obs-sec h3 { font: 500 13px/1 var(--ui); color: var(--mist); letter-spacing: .08em; margin-bottom: 10px; }
.lat-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.lat-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; padding: 7px 0; }
.lat-list .n { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lat-list .v { font-size: 13px; color: var(--frost); font-variant-numeric: tabular-nums; }
.lat-list .v.down { color: var(--coral); }
.lat-list .b { grid-column: 1 / -1; height: 2px; border-radius: 2px; background: rgba(236, 230, 218, .07); overflow: hidden; }
.lat-list .b i { display: block; height: 100%; width: var(--w); background: rgba(143, 201, 214, .55); border-radius: 2px; transform-origin: left; transition: width .5s var(--ease); }
.recent { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.recent a { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 4px 8px 4px 4px; margin: 0 -8px 0 -4px; border-radius: 10px; text-decoration: none; color: var(--paper); transition: background-color .2s ease; }
.recent a:hover { background: rgba(236, 230, 218, .04); }
.recent .mono { width: 30px; height: 30px; border-radius: 9px; font-size: 11px; }
.recent .mono.cjk { font-size: 13px; }
.recent .n { flex: 1; min-width: 0; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent time { font-size: 12px; color: var(--mist); white-space: nowrap; }
.obs-note { font-size: 12px; line-height: 1.6; color: var(--mist); }

/* ───────────── 浮层：遮罩 + 面板 ───────────── */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(5, 7, 12, .58); opacity: 0; transition: opacity .22s ease; }
.scrim.is-on { opacity: 1; }
.layer { position: fixed; z-index: 51; opacity: 0; transition: opacity .22s ease, transform .26s var(--ease); }
.layer.is-on { opacity: 1; transform: none !important; }
.panel { background: rgba(14, 19, 31, .90); -webkit-backdrop-filter: blur(26px) saturate(140%); backdrop-filter: blur(26px) saturate(140%); border: 1px solid var(--line-2);
  box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .9), inset 0 1px 0 rgba(236, 230, 218, .06); }

/* 网络菜单 */
.netmenu { left: 18px; bottom: 110px; width: 320px; border-radius: 18px; padding: 8px; transform: translateY(8px); }
.netmenu h3 { font: 500 15px/1.3 var(--serif); letter-spacing: .08em; padding: 10px 12px 6px; }
.opt { width: 100%; display: grid; grid-template-columns: 18px 1fr; align-items: start; gap: 10px; padding: 11px 12px; border: 0; border-radius: 12px; background: none; text-align: left; }
.opt:hover, .opt:focus-visible { background: rgba(236, 230, 218, .05); }
.opt:focus-visible { outline: none; box-shadow: inset 0 0 0 1px rgba(236, 230, 218, .3); }
.opt .rd { width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; border: 1.5px solid rgba(236, 230, 218, .35); display: grid; place-items: center; }
.opt[aria-checked="true"] .rd { border-color: var(--amber); }
.opt[aria-checked="true"] .rd::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
.opt b { display: block; font-size: 14.5px; font-weight: 500; }
.opt small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--mist); line-height: 1.5; }

    $("sh-h").textContent = "设置";
    $("sheet-b").innerHTML = '<button class="set-row" type="button" data-act="manage"><span>管理空间</span><small>' + CONFIG.spaces.length + ' 个自定义空间</small></button>' +
      '<button class="set-row" type="button" data-act="net"><span>访问方式</span><small>' + $("net-mode").textContent.replace("网络：", "") + "</small></button>" +
      '<div class="set-row" role="group" aria-label="本设备外观"><span>本设备外观</span><span class="seg"><button type="button" aria-pressed="false" data-look="classic">经典</button><button type="button" aria-pressed="true" data-look="v2">新版</button></span></div>' +
      '<p class="sheet-lead" style="margin-top:16px">外观开关只保存在这台设备上，两种外观共用同一份数据和功能。预览中仅演示开关位置。</p>';
    $("sheet-f").innerHTML = '<button class="btn" type="button" data-act="close">完成</button>';
    openLayer($("sheet"));
  }

  function setNet(n) { S.net = n; store.set("net", n); renderNet(); renderView(); renderObs(); toast(n === "auto" ? "已改为自动：当前走内网" : "已改为" + (n === "lan" ? "内网" : "外网") + "访问"); }

  var toastT = 0;
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("is-on"); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("is-on"); }, 2600); }

  /* ───────── 事件委托 ───────── */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-space],[data-act],[data-eng],[data-net],[data-item],[data-look]"); if (!t) return;
    if (t.hasAttribute("data-space")) { setSpace(t.getAttribute("data-space")); return; }
    if (t.hasAttribute("data-eng")) { S.engine = t.getAttribute("data-eng"); store.set("engine", S.engine); renderEngines(); return; }
    if (t.hasAttribute("data-net")) { closeLayer(); setNet(t.getAttribute("data-net")); return; }
    if (t.hasAttribute("data-look")) { if (t.getAttribute("data-look") === "classic") toast("正式版中切回经典外观；预览里保持新版"); return; }
    if (t.hasAttribute("data-item")) { e.preventDefault(); if (S.editing) { toast("编辑「" + itemById[t.getAttribute("data-item")].title + "」：正式版沿用现有编辑面板"); return; } if (suppressClick) { suppressClick = false; return; } openItem(itemById[t.getAttribute("data-item")]); return; }
    var a = t.getAttribute("data-act");
    if (a === "palette") openPalette();
    else if (a === "net") { if (open) closeLayer(true); openNet(t.id === "netbtn" || t.id === "netpill" ? t : (window.innerWidth < 900 ? $("netpill") : $("netbtn"))); }
    else if (a === "manage") { if (open) closeLayer(true); openManage(); }
    else if (a === "pick") openManage(t.getAttribute("data-sp"));
    else if (a === "close") closeLayer();
    else if (a === "save-spaces") saveSpaces();
    else if (a === "settings") openSettings();
    else if (a === "search") { var q = $("q"); q.focus(); var top = q.getBoundingClientRect().top + window.scrollY - 90; if (window.scrollY > top) window.scrollTo({ top: Math.max(0, top), behavior: reduced ? "auto" : "smooth" }); }
    else if (a === "edit") { S.editing = !S.editing; document.body.classList.toggle("editing", S.editing); }
    else if (a === "edit-done") { S.editing = false; document.body.classList.remove("editing"); }
  });
  $("search").addEventListener("submit", function (e) { e.preventDefault(); var v = $("q").value.trim(); if (!v) return; var en = ENGINES.filter(function (x) { return x[0] === S.engine; })[0][1]; toast("预览中不跳转：将用 " + en + " 搜索「" + v + "」"); });

  /* 长按保留给编辑模式（与 V1.1 一致）；短按 = 打开 */
  var lpT = 0, suppressClick = false, lpXY = null;
  document.addEventListener("touchstart", function (e) {
    var t = e.target.closest("[data-item]"); if (!t || S.editing) return;
    lpXY = [e.touches[0].clientX, e.touches[0].clientY];
    lpT = setTimeout(function () { suppressClick = true; S.editing = true; document.body.classList.add("editing"); if (navigator.vibrate) try { navigator.vibrate(10); } catch (x) {} }, 520);
  }, { passive: true });
  document.addEventListener("touchmove", function (e) { if (!lpXY) return; var dx = e.touches[0].clientX - lpXY[0], dy = e.touches[0].clientY - lpXY[1]; if (dx * dx + dy * dy > 100) { clearTimeout(lpT); lpXY = null; } }, { passive: true });
  document.addEventListener("touchend", function () { clearTimeout(lpT); lpXY = null; }, { passive: true });
  document.addEventListener("contextmenu", function (e) { if (e.target.closest("[data-item]") && window.matchMedia("(hover: none)").matches) e.preventDefault(); });

  window.addEventListener("resize", function () { moveIndicator(); }, { passive: true });

  /* ───────── 启动 ───────── */
  var isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  $("kbd-k").textContent = isMac ? "⌘K" : "Ctrl K";
  renderSpaces(); renderEngines(); renderNet(); applyTheme(); renderHeader(); renderView(); renderObs(); startClock();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveIndicator);
  setTimeout(function () { document.body.classList.remove("boot"); }, 1100);

  // 供截图脚本使用（预览专用）
  window.NocturneV2 = { setSpace: setSpace, openPalette: openPalette, openManage: openManage, openNet: function () { openNet(window.innerWidth < 900 ? $("netpill") : $("netbtn")); }, close: closeLayer, state: S, config: CONFIG };
})();

</script>
</body>
</html>
